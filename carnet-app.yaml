# 1. Le Stockage Physique (Le dossier sur votre WSL)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: carnet-pv-volume
spec:
  storageClassName: "manuel" # Nom spécifique pour forcer le lien
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data" # Les données seront ici sur votre Linux
---
# 2. La Demande de Stockage (Le ticket)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: carnet-storage-pvc
spec:
  storageClassName: "manuel" # Doit être identique au PV
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# 3. Les Secrets (Vos mots de passe)
apiVersion: v1
kind: Secret
metadata:
  name: carnet-secrets
type: Opaque
stringData:
  # Mettez vos vraies infos ici si vous voulez tester l'envoi d'email
  EMAIL_USER: "votre-email@gmail.com"
  EMAIL_PASS: "votre-mot-de-passe"
  EMAIL_TO: "votre-email@gmail.com"   # destinataire des messages de contact et notifications
  DEEPL_API_KEY: "votre-cle-api"      # (le code lit DEEPL_API_KEY ; l'ancien nom DEEPL_KEY n'était pas lu)
  DB_PATH: "/data/blog.db"
  # OBLIGATOIRES : l'application refuse de démarrer sans SESSION_SECRET.
  # Générez deux valeurs différentes avec :  openssl rand -hex 48
  SESSION_SECRET: "CHANGEZ-MOI"
  TWO_FA_KEY: "CHANGEZ-MOI"           # clé de chiffrement des secrets 2FA : à conserver, sinon la 2FA devient illisible
  # Si un Ingress/reverse-proxy est devant l'appli, décommentez (nombre de proxys) :
  # TRUST_PROXY: "1"
  # Si le site est servi en HTTP simple (NodePort sans TLS), le cookie "secure" empêcherait la connexion :
  # INSECURE_COOKIES: "true"
---
# 4. L'Application (Le Site)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carnet-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mon-site
  template:
    metadata:
      labels:
        app: mon-site
    spec:
      containers:
      - name: site-container
        # ▼▼▼ MODIFIEZ JUSTE EN DESSOUS ▼▼▼
        image: fr3d0r1c/carnet-stage:v1 
        # ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
        imagePullPolicy: Always # Force le téléchargement depuis Docker Hub
        ports:
        - containerPort: 3000
        # Toutes les clés du Secret "carnet-secrets" deviennent des variables d'environnement
        # (DB_PATH, SESSION_SECRET, EMAIL_USER, ...). Avant, seul DB_PATH était transmis.
        envFrom:
        - secretRef:
            name: carnet-secrets
        volumeMounts:
        - mountPath: "/data"
          name: mon-stockage
      volumes:
      - name: mon-stockage
        persistentVolumeClaim:
          claimName: carnet-storage-pvc
---
# 5. Le Réseau (Service)
apiVersion: v1
kind: Service
metadata:
  name: site-service
spec:
  type: NodePort
  selector:
    app: mon-site
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000