services:
  site-stage:
    build:
      context: .
      dockerfile: Dockerfile.homelab
    container_name: site-stage
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/blog.db
      - SESSIONS_DIR=/app/data
      - INSECURE_COOKIES=true
      - SITE_URL=http://192.168.1.133:3001
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data
      - ./data/uploads:/app/public/uploads
    restart: unless-stopped